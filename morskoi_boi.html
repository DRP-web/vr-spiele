<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Морской бой – Seeschlacht VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#0a1824; --deep:#06101a; --enamel:#2f6b66; --red:#d43a2c; --amber:#ffb340;
    --brass:#b8924a; --zinc:#dcd6c8; --muted:#8fa3ad;
    color-scheme: dark;
  }
  html,body{margin:0;height:100%;background:var(--sea);overflow:hidden;
    font-family:"PT Sans Narrow","Arial Narrow",Arial,sans-serif;color:var(--zinc);}
  canvas{display:block;touch-action:none;outline:none}
  #landing{position:fixed;inset:0;z-index:5;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);}
  #landing .scope{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 64% 50%, transparent 0 33vmin, rgba(184,146,74,.85) 33.2vmin 33.9vmin, rgba(4,10,16,.94) 34.1vmin);}
  #landing .scope::before,#landing .scope::after{content:"";position:absolute;background:rgba(255,179,64,.55)}
  #landing .scope::before{left:64%;top:calc(50% - 26vmin);width:1px;height:52vmin}
  #landing .scope::after{top:50%;left:calc(64% - 26vmin);height:1px;width:52vmin}
  #landing .plate{position:absolute;left:clamp(20px,5vw,72px);top:50%;transform:translateY(-50%);
    width:min(30rem,calc(100vw - 40px));max-width:calc(64vw - 36vmin - 4vw);min-width:17rem}
  h1{font-family:"Russo One","Arial Black",sans-serif;font-weight:400;color:var(--red);
    font-size:clamp(2.6rem,6vw,4.6rem);line-height:.95;margin:0 0 .35em;letter-spacing:.01em;
    text-shadow:0 0 18px rgba(212,58,44,.35)}
  .lede{font-size:1.35rem;line-height:1.3;margin:0 0 1.4rem;color:var(--zinc)}
  .btns{display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:1.2rem}
  button.push{font-family:"Russo One",sans-serif;font-size:1.05rem;border:0;cursor:pointer;
    padding:.95rem 1.4rem;border-radius:999px;color:#1a0d08;background:var(--amber);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px rgba(184,146,74,.6)}
  button.push.primary{background:var(--red);color:#fff4ea}
  button.push:hover{filter:brightness(1.08)}
  button.push:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 3px rgba(184,146,74,.6)}
  button.push:focus-visible{outline:3px solid #fff;outline-offset:4px}
  button.push[disabled]{opacity:.45;cursor:not-allowed}
  .note{font-size:1.02rem;line-height:1.35;color:var(--muted);margin:.2rem 0 0}
  .coin{display:inline-flex;align-items:center;gap:.6rem;margin-top:1.3rem;font-size:.95rem;color:var(--brass)}
  .coin i{display:inline-block;width:5px;height:26px;border-radius:3px;background:#000;box-shadow:0 0 0 3px var(--brass)}
  #status{min-height:1.4em}
  #deskhint{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);
    z-index:4;font-size:1rem;color:var(--zinc);background:rgba(6,16,26,.7);padding:.45rem .9rem;border-radius:8px;
    display:none;white-space:nowrap;pointer-events:none}
  #fire{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
    z-index:4;width:84px;height:84px;border-radius:50%;border:0;background:var(--red);color:#fff;
    font-family:"Russo One",sans-serif;font-size:1rem;display:none;box-shadow:0 0 0 4px var(--brass)}
  @media (max-aspect-ratio: 1/1){
    #landing .scope{background:radial-gradient(circle at 50% 27%, transparent 0 24vmin, rgba(184,146,74,.85) 24.2vmin 24.8vmin, rgba(4,10,16,.94) 25vmin);}
    #landing .scope::before{left:50%;top:calc(27% - 19vmin);height:38vmin}
    #landing .scope::after{top:27%;left:calc(50% - 19vmin);width:38vmin}
    #landing .plate{top:auto;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:none;max-width:none;min-width:0}
  }
</style>
</head>
<body>
<div id="landing">
  <div class="scope"></div>
  <div class="plate">
    <h1>Морской бой</h1>
    <p class="lede">Seeschlacht – der sowjetische Spielautomat mit dem Periskop, neu gebaut für die Meta&nbsp;Quest&nbsp;3.</p>
    <div class="btns">
      <button class="push primary" id="btnVR" disabled>Prüfe VR …</button>
      <button class="push" id="btnDesk">Am Bildschirm spielen</button>
    </div>
    <p class="note" id="status"></p>
    <p class="note">In VR zielst du mit dem Kopf und feuerst mit dem Abzug. Am Bildschirm zielst du mit der Maus.</p>
    <div class="coin"><i></i>15 коп.</div>
  </div>
</div>
<div id="deskhint">Maus: zielen · Klick oder Leertaste: Feuer · Q: Torpedotyp · Esc: Pause</div>
<button id="fire" aria-label="Feuer">Feuer</button>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   Grundlagen
   ============================================================ */
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
const fmt = n => Math.round(n).toLocaleString('de-DE');

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
const settings = Object.assign({ mask: true, assist: false, sound: true }, store.get('mb_settings', {}));
const saveSettings = () => store.set('mb_settings', settings);

/* ============================================================
   Renderer, Szene, Kamera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.xr.setFoveation(1);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const fleetFog = new THREE.FogExp2(0x9aaabb, 0.0008);
const classicFog = new THREE.FogExp2(0x7a4f60, 0.0016);
scene.fog = fleetFog;

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 6000);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.6, 0);
const rig = new THREE.Group();
rig.add(camera);
scene.add(rig);

const sunLight = new THREE.DirectionalLight(0xffffff, 2.4);
scene.add(sunLight, sunLight.target);
const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x3a4a55, 1.1);
scene.add(hemi);
const flashLight = new THREE.PointLight(0xffaa55, 0, 500, 0);
scene.add(flashLight);

const fleetWorld = new THREE.Group();
const classicWorld = new THREE.Group();
scene.add(fleetWorld, classicWorld);

let wtime = 0;       // Wellen-/Weltzeit
let gameTime = 0;
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpQ = new THREE.Quaternion();

/* ============================================================
   Audio – alles synthetisch erzeugt, keine Dateien nötig
   ============================================================ */
const listener = new THREE.AudioListener();
camera.add(listener);
const actx = listener.context;
const SR = actx.sampleRate;
const master = actx.createGain();
master.gain.value = settings.sound ? 0.9 : 0;
master.connect(listener.getInput());
const LP = fc => 1 - Math.exp(-2 * Math.PI * fc / SR);

function normalize(d) { let pk = 0; for (let i = 0; i < d.length; i++) pk = Math.max(pk, Math.abs(d[i])); if (pk > 0) { const g = 0.9 / pk; for (let i = 0; i < d.length; i++) d[i] *= g; } }
function makeBuf(sec, gen) {
  const n = Math.max(1, Math.floor(sec * SR));
  const b = actx.createBuffer(1, n, SR);
  const d = b.getChannelData(0);
  gen(d, n); normalize(d); return b;
}
function makeLoop(sec, gen) {
  const n = Math.floor(sec * SR), f = Math.floor(0.25 * SR);
  const tmp = new Float32Array(n + f);
  gen(tmp, n + f);
  const b = actx.createBuffer(1, n, SR); const d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = tmp[i];
  for (let i = 0; i < f; i++) { const t = i / f; d[i] = tmp[i] * t + tmp[n + i] * (1 - t); }
  normalize(d); return b;
}
const SFX = {};
function buildSounds() {
  SFX.boom = makeBuf(3.2, (d, n) => { let a = 0, b = 0; const k1 = LP(700), k2 = LP(90);
    for (let i = 0; i < n; i++) { const t = i / SR, w = Math.random() * 2 - 1; a += k1 * (w - a); b += k2 * (w - b);
      const env = Math.exp(-t * 1.4) * Math.min(1, t / 0.008); const crack = t < 0.15 ? w * Math.exp(-t * 28) * 0.7 : 0;
      const thump = Math.sin(2 * Math.PI * (48 * t - 10 * t * t)) * Math.exp(-t * 3);
      d[i] = a * 1.7 * env + b * 6 * env + crack + thump * 0.9; } });
  SFX.depth = makeBuf(3.6, (d, n) => { let a = 0, b = 0; const k1 = LP(260), k2 = LP(55);
    for (let i = 0; i < n; i++) { const t = i / SR, w = Math.random() * 2 - 1; a += k1 * (w - a); b += k2 * (w - b);
      const env = Math.exp(-t * 0.85) * Math.min(1, t / 0.03); const thump = Math.sin(2 * Math.PI * (36 * t - 5 * t * t)) * Math.exp(-t * 2);
      d[i] = a * 2 * env + b * 7 * env + thump * 1.3; } });
  const bubbles = []; for (let i = 0; i < 26; i++) bubbles.push([rand(0.15, 1.2), rand(280, 900)]);
  SFX.launch = makeBuf(1.5, (d, n) => { let a = 0; const k = LP(1300);
    for (let i = 0; i < n; i++) { const t = i / SR, w = Math.random() * 2 - 1; a += k * (w - a);
      const env = t < 0.03 ? t / 0.03 : Math.exp(-(t - 0.03) * 3.2);
      let v = a * env * 1.6 + Math.sin(2 * Math.PI * 95 * t) * Math.exp(-t * 16) * 0.9;
      for (const [t0, f] of bubbles) { const tt = t - t0; if (tt > 0 && tt < 0.08) v += Math.sin(2 * Math.PI * f * tt * (1 + tt * 9)) * Math.exp(-tt * 55) * 0.25; }
      d[i] = v; } });
  SFX.splash = makeBuf(1.4, (d, n) => { let a = 0, h = 0; const k = LP(3200), k2 = LP(380);
    for (let i = 0; i < n; i++) { const t = i / SR, w = Math.random() * 2 - 1; a += k * (w - a); h += k2 * (a - h);
      d[i] = (a - h) * (t < 0.02 ? t / 0.02 : Math.exp(-t * 2.6)); } });
  SFX.ping = makeBuf(2.2, (d, n) => { for (let i = 0; i < n; i++) { const t = i / SR;
      let v = Math.sin(2 * Math.PI * 1180 * t) * (t < 0.004 ? t / 0.004 : Math.exp(-t * 3.4));
      const t2 = t - 0.42; if (t2 > 0) v += 0.28 * Math.sin(2 * Math.PI * 1180 * t2) * Math.exp(-t2 * 4);
      d[i] = v; } });
  SFX.alarm = makeBuf(1.6, (d, n) => { let ph = 0, y = 0; const k = LP(2400);
    for (let i = 0; i < n; i++) { const t = i / SR, c = t % 0.8; const f = c < 0.55 ? 180 + (c / 0.55) * 260 : 440;
      const env = c < 0.68 ? Math.min(1, c / 0.02) : Math.max(0, 1 - (c - 0.68) / 0.05);
      ph += f / SR; const saw = (ph % 1) * 2 - 1, sq = (ph % 1) < 0.5 ? 1 : -1;
      y += k * ((saw * 0.6 + sq * 0.35) * env - y); d[i] = y; } });
  SFX.tick = makeBuf(0.05, (d, n) => { for (let i = 0; i < n; i++) { const t = i / SR;
      d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 420) + Math.sin(2 * Math.PI * 1800 * t) * Math.exp(-t * 240) * 0.6; } });
  SFX.coin = makeBuf(1.0, (d, n) => { const parts = [[0, 2637], [0, 3520], [0, 4699], [0.17, 2489], [0.17, 3322], [0.17, 4435]];
    for (let i = 0; i < n; i++) { const t = i / SR; let v = 0;
      for (const [t0, f] of parts) { const tt = t - t0; if (tt > 0) v += Math.sin(2 * Math.PI * f * tt) * Math.exp(-tt * 9) * (tt < 0.003 ? tt / 0.003 : 1); }
      d[i] = v; } });
  SFX.horn = makeBuf(2.6, (d, n) => { let a = 0, p1 = 0, p2 = 0; const k = LP(650);
    for (let i = 0; i < n; i++) { const t = i / SR; const env = Math.max(0, Math.min(1, t / 0.25) * Math.min(1, (2.6 - t) / 0.45));
      p1 += 82 / SR; p2 += 123.5 / SR; const v = ((p1 % 1) * 2 - 1) + ((p2 % 1) * 2 - 1) * 0.8; a += k * (v - a); d[i] = a * env; } });
  SFX.retroHit = makeBuf(1.3, (d, n) => { let ph = 0;
    for (let i = 0; i < n; i++) { const t = i / SR; const f = 900 * Math.exp(-t * 4) + 60; ph += f / SR;
      d[i] = ((ph % 1) < 0.5 ? 0.5 : -0.5) * Math.exp(-t * 1.2) + (Math.random() * 2 - 1) * 0.45 * Math.exp(-t * 3); } });
  SFX.click = makeBuf(0.07, (d, n) => { for (let i = 0; i < n; i++) { const t = i / SR; d[i] = Math.sin(2 * Math.PI * 1400 * t) * Math.exp(-t * 90); } });
  SFX.empty = makeBuf(0.25, (d, n) => { for (let i = 0; i < n; i++) { const t = i / SR; d[i] = (Math.sin(2 * Math.PI * 220 * t) > 0 ? 0.6 : -0.6) * Math.exp(-t * 14); } });
  const tri = (ph) => { const x = ph % 1; return x < 0.5 ? x * 4 - 1 : 3 - x * 4; };
  const melody = (notes, durs) => (d, n) => { let t0 = 0, ph = 0;
    const starts = []; for (let j = 0; j < notes.length; j++) { starts.push(t0); t0 += durs[j]; }
    for (let i = 0; i < n; i++) { const t = i / SR; let j = notes.length - 1; while (j > 0 && t < starts[j]) j--;
      const tt = t - starts[j]; ph += notes[j] / SR; d[i] = tri(ph) * Math.min(1, tt / 0.01) * Math.exp(-tt * 3.2); } };
  SFX.fanfare = makeBuf(1.3, melody([523, 659, 784, 1047], [0.14, 0.14, 0.14, 0.9]));
  SFX.gameover = makeBuf(2.0, melody([392, 330, 262, 196], [0.32, 0.32, 0.32, 1.0]));
  SFX.bell = makeBuf(2.2, (d, n) => { for (let i = 0; i < n; i++) { const t = i / SR;
      d[i] = Math.sin(2 * Math.PI * 660 * t) * Math.exp(-t * 2) + 0.5 * Math.sin(2 * Math.PI * 660 * 2.76 * t) * Math.exp(-t * 3.5) + 0.25 * Math.sin(2 * Math.PI * 660 * 5.4 * t) * Math.exp(-t * 6); } });
  SFX.creak = makeBuf(2.2, (d, n) => { let a = 0; const k = LP(300);
    for (let i = 0; i < n; i++) { const t = i / SR, w = Math.random() * 2 - 1; a += k * (w - a);
      const env = Math.sin(Math.PI * t / 2.2); d[i] = (Math.sin(2 * Math.PI * (62 * t - 4 * t * t)) * (0.7 + 0.3 * Math.sin(2 * Math.PI * 7 * t)) * 0.6 + a * 0.8) * env; } });
  SFX.torpLoop = makeLoop(1.0, (d, n) => { let a = 0; const k = LP(700);
    for (let i = 0; i < n; i++) { const t = i / SR, w = Math.random() * 2 - 1; a += k * (w - a);
      d[i] = a * (0.65 + 0.35 * Math.sin(2 * Math.PI * 28 * t)) + Math.sin(2 * Math.PI * 140 * t) * 0.08; } });
  SFX.sea = makeLoop(6.0, (d, n) => { let b = 0, a = 0; const k = LP(900);
    for (let i = 0; i < n; i++) { const t = i / SR, w = Math.random() * 2 - 1; b = b * 0.996 + w * 0.03; a += k * (w - a);
      d[i] = b * (0.75 + 0.25 * Math.sin(2 * Math.PI * t / 3)) + a * 0.35 * (0.6 + 0.4 * Math.sin(2 * Math.PI * t / 2 + 1)); } });
  SFX.hum = makeLoop(2.0, (d, n) => { for (let i = 0; i < n; i++) { const t = i / SR;
      d[i] = Math.sin(2 * Math.PI * 50 * t) + 0.5 * Math.sin(2 * Math.PI * 100 * t) + 0.25 * Math.sin(2 * Math.PI * 150 * t) + (Math.random() - 0.5) * 0.05; } });
  SFX.engine = makeLoop(2.0, (d, n) => { let a = 0; const k = LP(140);
    for (let i = 0; i < n; i++) { const t = i / SR, w = Math.random() * 2 - 1; a += k * (w - a);
      d[i] = Math.sin(2 * Math.PI * 30 * t) * 0.5 + Math.sin(2 * Math.PI * 60 * t) * 0.3 + a * 2.5; } });
}
buildSounds();

function setPannerPos(p, x, y, z) {
  if (p.positionX) { p.positionX.value = x; p.positionY.value = y; p.positionZ.value = z; } else p.setPosition(x, y, z);
}
function play2D(name, vol = 1, rate = 1, delay = 0) {
  if (!SFX[name]) return null;
  const s = actx.createBufferSource(); s.buffer = SFX[name]; s.playbackRate.value = rate;
  const g = actx.createGain(); g.gain.value = vol;
  s.connect(g).connect(master); s.start(actx.currentTime + delay); return s;
}
function playAt(name, x, y, z, vol = 1, rate = 1, delay = 0) {
  if (!SFX[name]) return null;
  const s = actx.createBufferSource(); s.buffer = SFX[name]; s.playbackRate.value = rate;
  const g = actx.createGain(); g.gain.value = vol;
  const p = actx.createPanner(); p.panningModel = 'HRTF'; p.distanceModel = 'inverse';
  p.refDistance = 50; p.rolloffFactor = 1; p.maxDistance = 10000; setPannerPos(p, x, y, z);
  s.connect(g).connect(p).connect(master); s.start(actx.currentTime + delay); return s;
}
function loopSound(name, vol = 1, positional = false) {
  const s = actx.createBufferSource(); s.buffer = SFX[name]; s.loop = true;
  const g = actx.createGain(); g.gain.value = vol;
  let p = null;
  if (positional) { p = actx.createPanner(); p.panningModel = 'HRTF'; p.distanceModel = 'inverse'; p.refDistance = 30; p.rolloffFactor = 1.2; s.connect(g).connect(p).connect(master); }
  else s.connect(g).connect(master);
  s.start();
  return {
    setPos(x, y, z) { if (p) setPannerPos(p, x, y, z); },
    setVol(v) { g.gain.setTargetAtTime(v, actx.currentTime, 0.1); },
    stop() { try { g.gain.setTargetAtTime(0, actx.currentTime, 0.08); s.stop(actx.currentTime + 0.4); } catch (e) { } }
  };
}
let seaLoop = null, humLoop = null, engineLoop = null;
function setAmbience(kind) {
  const want = { sea: kind === 'fleet' || kind === 'menu', hum: kind === 'classic', engine: kind === 'fleet' };
  if (want.sea && !seaLoop) seaLoop = loopSound('sea', 0.32);
  if (!want.sea && seaLoop) { seaLoop.stop(); seaLoop = null; }
  if (want.hum && !humLoop) humLoop = loopSound('hum', 0.05);
  if (!want.hum && humLoop) { humLoop.stop(); humLoop = null; }
  if (want.engine && !engineLoop) engineLoop = loopSound('engine', 0.12);
  if (!want.engine && engineLoop) { engineLoop.stop(); engineLoop = null; }
}

/* ============================================================
   Haptik
   ============================================================ */
function haptic(intensity, ms, hand) {
  const s = renderer.xr.getSession(); if (!s) return;
  for (const src of s.inputSources) {
    if (hand && src.handedness !== hand) continue;
    const h = src.gamepad && src.gamepad.hapticActuators && src.gamepad.hapticActuators[0];
    if (h && h.pulse) { try { h.pulse(intensity, ms); } catch (e) { } }
  }
}

/* ============================================================
   Partikel (Rauch, Feuer, Gischt, Lampen)
   ============================================================ */
const PART_VS = `
attribute vec4 aColor; attribute float aSize;
uniform float uScale; uniform float uFogDensity;
varying vec4 vC; varying float vFog;
void main(){
  vec4 mv = modelViewMatrix * vec4(position,1.0);
  gl_Position = projectionMatrix * mv;
  float z = max(0.5, -mv.z);
  gl_PointSize = clamp(aSize * uScale * projectionMatrix[1][1] / z, 1.0, 1024.0);
  vC = aColor;
  float fd = uFogDensity * z; vFog = 1.0 - exp(-fd*fd);
}`;
const PART_FS = `
uniform vec3 uFogColor; uniform float uAdd;
varying vec4 vC; varying float vFog;
void main(){
  vec2 c = gl_PointCoord*2.0-1.0; float r = dot(c,c);
  if(r>1.0) discard;

      this.roll = damp(this.roll, Math.atan((hr - hl) / this.B) * 0.6 * this.bobScale + Math.sin(this.t * 0.7) * 0.012, 2, dt);

      lines.forEach((l, i) => { g.font = i === 1 && !isOver ? `34px ${FONT_B}` : `50px ${FONT_B}`; g.fillText(l, P.W / 2, 290 + i * 80); });
      const labels = isOver ? ['Nochmal', 'Hauptmenü'] : ['Weiter', 'Hauptmenü', 'Neu starten'];
      P.buttons.forEach((b, i) => { btnStyle(g, b, P.hover === i); g.fillStyle = '#ffb340'; g.font = `52px ${FONT_D}`; g.fillText(labels[i], b.x + b.w / 2, b.y + b.h / 2 + 18); });
    };
  }
  P.redraw();
}
function startGame(kind) {
  actx.resume(); play2D('click', 0.5);
  if (app.game) app.game.dispose();
  closePanel(); bannerPanel.mesh.visible = false; banner = null;
  if (menuDecor) { menuDecor.dispose(); menuDecor = null; }
  app.game = kind === 'classic' ? new ClassicGame() : new FleetGame();
  app.state = 'play'; app.game.start(); updateDeskUI();
  desk.yaw = 0; desk.pitch = 0; aim.bearing = 0;
  if (!app.xr) lockPointer();
}
function resumeGame() {
  closePanel(); app.state = 'play'; play2D('click', 0.5);
  if (app.game) { maskMesh.visible = settings.mask || app.game.kind === 'classic'; infoPanel.mesh.visible = app.game.kind === 'fleet'; }
  if (!app.xr) lockPointer(); updateDeskUI();
}
function pauseGame() { if (app.state !== 'play') return; openPanel('pause'); }
function toMainMenu() {
  if (app.game) { app.game.dispose(); app.game = null; }
  showMenuScene(); openPanel('main');
}
function showMenuScene() {
  setWorld('fleet'); setEnv(ENVS[3]); setAmbience('menu'); maskMesh.visible = false; hudPanel.mesh.visible = false; infoPanel.mesh.visible = false;
  if (menuDecor) menuDecor.dispose();
  menuDecor = new Ship('freighter', 650, -620, -100 * DEG + Math.PI, 6);
  menuDecor.h = menuDecor.th = -Math.PI / 2 - 0.2;
}

/* ============================================================
   Eingabe: VR-Controller
   ============================================================ */
const raycaster = new THREE.Raycaster();
const ctrls = [];
const laserMat = new THREE.LineBasicMaterial({ color: 0xffb340, transparent: true, opacity: 0.85, depthTest: false });
const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
function handleModel() {
  const g = new THREE.Group();
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.023, 0.12, 12), new THREE.MeshLambertMaterial({ color: 0x23272b }));
  grip.rotation.x = -0.6; grip.position.set(0, -0.02, 0.03); g.add(grip);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.024, 0.006, 8, 16), new THREE.MeshLambertMaterial({ color: 0xb8924a }));
  ring.rotation.x = Math.PI / 2 - 0.6; ring.position.set(0, 0.02, -0.005); g.add(ring);
  const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.012, 12), new THREE.MeshLambertMaterial({ color: 0xd43a2c, emissive: 0x401008 }));
  btn.rotation.x = -0.6; btn.position.set(0, 0.03, -0.015); g.add(btn);
  return g;
}
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  const laser = new THREE.Line(laserGeo, laserMat); laser.scale.z = 3; laser.renderOrder = 1001; laser.visible = false; c.add(laser);
  const st = { c, laser, src: null, prevA: false, prevB: false, stickArmed: true };
  c.addEventListener('connected', e => { st.src = e.data; });
  c.addEventListener('disconnected', () => { st.src = null; });
  c.addEventListener('selectstart', () => onTrigger(st));
  c.addEventListener('squeezestart', () => { if (app.state === 'play' && app.game && app.game.toggleType) app.game.toggleType(); });
  rig.add(c);
  const grip = renderer.xr.getControllerGrip(i); grip.add(handleModel()); rig.add(grip);
  ctrls.push(st);
}
function panelRay(origin, dir) {
  if (!menuPanel.mesh.visible) return null;
  raycaster.set(origin, dir); const hit = raycaster.intersectObject(menuPanel.mesh, false)[0];
  return hit || null;
}
function onTrigger(st) {
  actx.resume();
  if (menuPanel.mesh.visible) {
    st.c.getWorldPosition(tmpV); tmpQ.setFromRotationMatrix(st.c.matrixWorld); tmpV2.set(0, 0, -1).applyQuaternion(tmpQ);
    const h = panelRay(tmpV, tmpV2); if (h) { const i = menuPanel.hitButton(h.uv); if (i >= 0) menuPanel.buttons[i].act(); }
    return;
  }
  if (app.state === 'play' && app.game) { app.game.fire(); haptic(0.4, 40, st.src ? st.src.handedness : undefined); }
}
function pollXR(dt) {
  let hover = -1;
  for (const st of ctrls) {
    const vis = menuPanel.mesh.visible && !!st.src;
    st.laser.visible = vis;
    if (vis) {
      st.c.getWorldPosition(tmpV); tmpQ.setFromRotationMatrix(st.c.matrixWorld); tmpV2.set(0, 0, -1).applyQuaternion(tmpQ);
      const h = panelRay(tmpV, tmpV2);
      st.laser.scale.z = h ? h.distance : 3;
      if (h) { const i = menuPanel.hitButton(h.uv); if (i >= 0) hover = i; }
    }
    const gp = st.src && st.src.gamepad; if (!gp) continue;
    const A = !!(gp.buttons[4] && gp.buttons[4].pressed), B = !!(gp.buttons[5] && gp.buttons[5].pressed);
    if (A && !st.prevA && app.state === 'play' && app.game && app.game.toggleType) app.game.toggleType();
    if (B && !st.prevB) { if (app.state === 'play') pauseGame(); else if (app.state === 'pause') resumeGame(); }
    st.prevA = A; st.prevB = B;
    const ax = gp.axes.length >= 4 ? gp.axes[2] : (gp.axes[0] || 0);
    if (app.state === 'play' && app.game && app.game.kind === 'fleet') {
      if (st.stickArmed && Math.abs(ax) > 0.75) { st.stickArmed = false; rig.rotation.y += ax > 0 ? -Math.PI / 4 : Math.PI / 4; play2D('click', 0.25, 0.8); }
      if (Math.abs(ax) < 0.3) st.stickArmed = true;
    }
  }
  if (menuPanel.mesh.visible && hover !== menuPanel.hover) { menuPanel.hover = hover; menuPanel.redraw(); }
}

/* ============================================================
   Eingabe: Bildschirm (Maus, Tastatur, Touch)
   ============================================================ */
const desk = { yaw: 0, pitch: 0, drag: null, keys: {} };
const canvasEl = renderer.domElement;
const deskHint = document.getElementById('deskhint');
const fireBtn = document.getElementById('fire');
const isTouch = matchMedia('(pointer: coarse)').matches;
function lockPointer() { if (isTouch || app.xr) return; try { const p = canvasEl.requestPointerLock(); if (p && p.catch) p.catch(() => { }); } catch (e) { } }
function updateDeskUI() {
  const playing = !app.xr && app.state === 'play';
  deskHint.style.display = playing && !isTouch ? 'block' : 'none';
  fireBtn.style.display = playing && isTouch ? 'block' : 'none';
}
function mouseRayPanel(ev) {
  const r = canvasEl.getBoundingClientRect();
  const nd = new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(nd, camera); const h = raycaster.intersectObject(menuPanel.mesh, false)[0];
  return h ? menuPanel.hitButton(h.uv) : -1;
}
canvasEl.addEventListener('contextmenu', e => e.preventDefault());
canvasEl.addEventListener('pointerdown', e => {
  if (app.xr || app.state === 'landing') return;
  actx.resume();
  desk.drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), id: e.pointerId, moved: false };
  if (app.state === 'play' && !isTouch) {
    if (document.pointerLockElement === canvasEl) { if (e.button === 0) app.game.fire(); else if (e.button === 2 && app.game.toggleType) app.game.toggleType(); }
    else lockPointer();
  }
});
canvasEl.addEventListener('pointermove', e => {
  if (app.xr) return;
  if (document.pointerLockElement === canvasEl) { desk.yaw -= e.movementX * 0.0022; desk.pitch -= e.movementY * 0.0022; }
  else if (desk.drag && desk.drag.id === e.pointerId) {
    const dx = e.clientX - desk.drag.x, dy = e.clientY - desk.drag.y; desk.drag.x = e.clientX; desk.drag.y = e.clientY;
    if (Math.hypot(e.clientX - desk.drag.sx, e.clientY - desk.drag.sy) > 8) desk.drag.moved = true;
    const k = 1.2 / canvasEl.clientHeight * (camera.fov * DEG); desk.yaw += dx * k; desk.pitch += dy * k;
  } else if (menuPanel.mesh.visible) { const i = mouseRayPanel(e); if (i !== menuPanel.hover) { menuPanel.hover = i; menuPanel.redraw(); canvasEl.style.cursor = i >= 0 ? 'pointer' : 'default'; } }
  desk.pitch = clamp(desk.pitch, -80 * DEG, 80 * DEG);
});
canvasEl.addEventListener('pointerup', e => {
  if (app.xr || !desk.drag) return;
  const d = desk.drag; desk.drag = null;
  if (d.moved) return;
  if (menuPanel.mesh.visible) { const i = mouseRayPanel(e); if (i >= 0) menuPanel.buttons[i].act(); return; }
  if (app.state === 'play' && isTouch && performance.now() - d.t < 350) app.game.fire();
});
fireBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); actx.resume(); if (app.state === 'play' && app.game) app.game.fire(); });
document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && app.state === 'play' && !app.xr) pauseGame(); });
window.addEventListener('keydown', e => {
  desk.keys[e.code] = true;
  if (app.xr || app.state === 'landing') return;
  if (e.code === 'Space') { e.preventDefault(); if (app.state === 'play') app.game.fire(); }
  if ((e.code === 'KeyQ' || e.code === 'KeyE') && app.state === 'play' && app.game.toggleType) app.game.toggleType();
  if (e.code === 'Escape' || e.code === 'KeyP') { if (app.state === 'play') pauseGame(); else if (app.state === 'pause') resumeGame(); }
});
window.addEventListener('keyup', e => { desk.keys[e.code] = false; });
function updateDesktopCamera(dt) {
  const k = desk.keys; const sp = 1.4 * dt;
  if (k.ArrowLeft || k.KeyA) desk.yaw += sp; if (k.ArrowRight || k.KeyD) desk.yaw -= sp;
  if (k.ArrowUp || k.KeyW) desk.pitch += sp; if (k.ArrowDown || k.KeyS) desk.pitch -= sp;
  desk.pitch = clamp(desk.pitch, -80 * DEG, 80 * DEG);
  if (app.state === 'landing') { desk.yaw = Math.sin(wtime * 0.05) * 0.5 - 0.35; desk.pitch = -0.02; }
  camera.position.set(0, 1.6, 0); camera.rotation.set(desk.pitch, desk.yaw, 0);
}
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ============================================================
   Landing / VR-Sitzung
   ============================================================ */
const landing = document.getElementById('landing');
const btnVR = document.getElementById('btnVR'), btnDesk = document.getElementById('btnDesk'), statusEl = document.getElementById('status');
async function checkXR() {
  if (!navigator.xr) { btnVR.textContent = 'VR nicht verfügbar'; statusEl.textContent = 'Öffne diese Seite im Browser der Quest, um in VR zu spielen.'; return; }
  try { const ok = await navigator.xr.isSessionSupported('immersive-vr');
    if (ok) { btnVR.disabled = false; btnVR.textContent = 'In VR spielen'; } else { btnVR.textContent = 'VR nicht verfügbar'; statusEl.textContent = 'Dieser Browser bietet kein VR. Auf der Quest funktioniert es im eingebauten Browser.'; }
  } catch (e) { btnVR.textContent = 'VR nicht verfügbar'; }
}
checkXR();
btnVR.addEventListener('click', async () => {
  actx.resume();
  try {
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] });
    session.addEventListener('end', onSessionEnd);
    await renderer.xr.setSession(session);
    app.xr = true; landing.style.display = 'none';
    showMenuScene(); setTimeout(() => openPanel('main'), 150);
  } catch (e) { statusEl.textContent = 'VR konnte nicht gestartet werden: ' + (e.message || e); }
});
btnDesk.addEventListener('click', () => { actx.resume(); app.xr = false; landing.style.display = 'none'; showMenuScene(); openPanel('main'); });
function onSessionEnd() {
  app.xr = false; if (app.game) { app.game.dispose(); app.game = null; }
  closePanel(); landing.style.display = ''; app.state = 'landing'; showMenuScene(); bannerPanel.mesh.visible = false; banner = null; updateDeskUI();
}

/* ============================================================
   Hauptschleife
   ============================================================ */
let last = performance.now();
const vpSize = new THREE.Vector2();
showMenuScene();
renderer.setAnimationLoop(() => {
  const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now;
  wtime += dt;
  if (renderer.xr.isPresenting) renderer.xr.updateCamera(camera); else updateDesktopCamera(dt);
  camera.updateMatrixWorld(true);
  updateAim(dt);
  if (renderer.xr.isPresenting) pollXR(dt);
  if (app.state === 'play' && app.game) { gameTime += dt; app.game.update(dt); }
  if (menuDecor) menuDecor.update(dt);
  if (app.state !== 'pause') { fxN.update(dt); fxA.update(dt); updatePopups(dt); }
  updateEnv(dt); updateBanner(dt);
  // Maske öffnen
  if (maskMesh.visible) maskU.uRcur.value = damp(maskU.uRcur.value, maskTargetR, 3.5, dt);
  // Blitzlicht
  flashI = Math.max(0, flashI - dt * 18); flashLight.intensity = flashI;
  // Himmel & Uhren
  oceanU.uTime.value = wtime; skyU.uTime.value = wtime;
  camera.getWorldPosition(headPos); sky.position.copy(headPos); stars.position.copy(headPos);
  // Partikel-Skalierung je Auge
  let vh;
  if (renderer.xr.isPresenting) { const xc = renderer.xr.getCamera(); vh = xc.cameras.length && xc.cameras[0].viewport ? xc.cameras[0].viewport.w : 1600; }
  else { renderer.getDrawingBufferSize(vpSize); vh = vpSize.y; }
  for (const s of [fxN, fxA]) { s.mat.uniforms.uScale.value = vh * 0.5; s.mat.uniforms.uFogDensity.value = scene.fog.density; s.mat.uniforms.uFogColor.value.copy(scene.fog.color); }
  renderer.render(scene, camera);
});

/* Schriften laden und Panels neu zeichnen */
Promise.all([document.fonts.load(`40px "Russo One"`), document.fonts.load(`40px "PT Sans Narrow"`)]).then(() => {
  if (menuPanel.mesh.visible) buildPanel(); drawReticle(app.game && app.game.kind === 'classic' ? 'classic' : 'fleet');
}).catch(() => { });

/* Testzugang (nur für Entwicklung) */
window.__mb = { THREE, raycaster, app, startGame, openPanel, settings, scene, classic, maskMesh, camera, classicWorld, fxN, fxA, counterPanel, get game() { return app.game; }, setEnv, ENVS, aim, desk };
const q = new URLSearchParams(location.search);
if (q.get('autostart')) { landing.style.display = 'none'; app.xr = false; startGame(q.get('autostart')); }
</script>
